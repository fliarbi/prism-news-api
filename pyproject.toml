[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-news-api"
version = "0.2.0"
description = "Prism News Exploration API — keyword, sentiment, GCP class, theme and priority lenses over Prism's 450M+ news archive"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary. © Fliar Business Intelligence. All rights reserved."}
authors = [{name = "Fliar Business Intelligence"}]
dependencies = [
  "fastapi>=0.115,<0.117",
  "uvicorn>=0.30",
  "gunicorn>=21",
  "pydantic>=2.7,<3",
  "pymongo>=4.6",
  "redis>=5",
  "uhashring",
  "mmh3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["prism_news_api", "prism_news_api.features"]

[tool.setuptools.package-data]
prism_news_api = ["data/*.json", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
